<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balance</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">

</head>

<body>

<nav>
<button onclick="showScreen('hoy')">Hoy</button>
<button onclick="showScreen('comer')">Comer</button>
<button onclick="showScreen('progreso')">Progreso</button>
<button onclick="showScreen('historial')">Historial</button>
</nav>

<main>

<!-- HOY -->
<section id="hoy" class="screen active">

<h2>Hoy</h2>

<p>🔥 Consumidas: 0 kcal</p>
<p>🏃 Gastadas: 2200 kcal</p>
<p>⚖️ Balance: 0 kcal</p>

<button onclick="abrirCamara()">📷 Sacar foto</button>

<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none"/>

<h3>Registro</h3>
<div id="registro"></div>

</section>

<!-- COMER -->
<section id="comer" class="screen">
<h2>Agregar comida</h2>
<button onclick="abrirCamara()">📷 Sacar foto</button>
</section>

<!-- PROGRESO -->
<section id="progreso" class="screen">
<h2>Progreso</h2>
<div id="grafico"></div>
</section>

<!-- HISTORIAL -->
<section id="historial" class="screen">
<h2>Historial</h2>
<div id="historialDias"></div>
</section>

</main>

<script src="app.js"></script>

</body>
</html>
